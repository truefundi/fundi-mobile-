kind = "mobile"
previewPath = "/"
title = "Site Visit Logger"
description = "A mobile field app for recording site visits with photos, notes, and current location, plus a shared feed for office teams to review recent activity."
version = "1.0.0"
id = "artifacts/site-visit-logger"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22273

[services.development]
run = "pnpm --filter @workspace/site-visit-logger run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/site-visit-logger", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/site-visit-logger", "run", "serve" ]

[services.env]
PORT = "22273"
BASE_PATH = "/"
